<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tá na Mão — Gestão de Condomínios</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/mobile-fix.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var OLD_API = 'https://ta-na-mao-1.onrender.com';
        var NEW_API = 'https://ta-na-mao-9bii.onrender.com';
        var nativeFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          if (typeof input === 'string') {
            input = input.replace(OLD_API, NEW_API);
          } else if (input && input.url && input.url.indexOf(OLD_API) === 0) {
            input = new Request(input.url.replace(OLD_API, NEW_API), input);
          }
          return nativeFetch(input, init);
        };
      })();
    </script>
    <script src="/portal-direto.js?v=1"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
