<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enviar orçamento — Tá na Mão</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f3;color:#102016;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:0 auto;padding:28px 16px 50px}.brand{font-weight:900;color:#003b24;font-size:20px;margin-bottom:22px}.card{background:#fff;border:1px solid #dce7de;border-radius:20px;box-shadow:0 10px 35px rgba(0,59,36,.07);overflow:hidden}.head{background:#003b24;color:#fff;padding:26px}.head h1{margin:0 0 8px;font-size:25px}.head p{margin:0;opacity:.9;line-height:1.45}.body{padding:24px}.info{background:#eff8f1;border:1px solid #cfe7d5;border-radius:14px;padding:14px;margin-bottom:20px}.info b{display:block;margin-bottom:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:15px}.field.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:#506057}input,textarea{width:100%;border:1px solid #d4dfd7;border-radius:11px;padding:12px;font:inherit;background:#fff}textarea{min-height:90px;resize:vertical}.required{color:#b42318}.file{padding:10px;background:#f8faf8}.submit{width:100%;border:0;border-radius:12px;padding:14px;background:#006b3b;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.success{padding:28px;text-align:center}.success .check{font-size:45px}.error{display:none;background:#fff0f0;color:#a61b1b;border:1px solid #f0b8b8;border-radius:11px;padding:12px;margin-bottom:15px}.muted{color:#66746b;font-size:12px;line-height:1.5}@media(max-width:620px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head>
<body><main class="wrap"><div class="brand">TA NA MÃO</div><section class="card" id="app"><div class="head"><h1>Enviar orçamento</h1><p>Preencha os dados abaixo para enviar sua proposta ao condomínio.</p></div><div class="body" id="content">Carregando solicitação...</div></section></main>
<script>
const API='https://ta-na-mao-1.onrender.com/api';const token=new URLSearchParams(location.search).get('token');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){if(!token)return showError('Link de cotação inválido.');try{const r=await fetch(API+'/cotacoes/public/'+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw Error(d.error||'Solicitação não encontrada.');if(d.bloqueada)return document.getElementById('content').innerHTML='<div class="success"><div class="check">✅</div><h2>Orçamento já recebido</h2><p class="muted">Esta solicitação já foi preenchida por um fornecedor. Obrigado!</p></div>';render(d)}catch(e){showError(e.message)}}
function render(d){document.getElementById('content').innerHTML=`<div class="info"><b>🏢 ${esc(d.condominio)}</b><div><strong>Serviço / compra:</strong> ${esc(d.servico)}</div>${d.descricao?`<div style="margin-top:7px"><strong>Descrição:</strong> ${esc(d.descricao)}</div>`:''}${d.prazoEnvio?`<div style="margin-top:7px"><strong>Prazo para envio:</strong> ${esc(d.prazoEnvio)}</div>`:''}</div><div class="error" id="err"></div><form id="form"><div class="grid"><div class="field"><label>Empresa <span class="required">*</span></label><input name="empresa" required></div><div class="field"><label>CNPJ <span class="required">*</span></label><input name="cnpj" required></div><div class="field"><label>Responsável <span class="required">*</span></label><input name="responsavel" required></div><div class="field"><label>WhatsApp <span class="required">*</span></label><input name="whatsapp" required></div><div class="field"><label>Valor do orçamento (R$) <span class="required">*</span></label><input name="valor" type="number" min="0" step="0.01" required></div><div class="field"><label>Prazo de execução</label><input name="prazoExecucao" placeholder="Ex.: 5 dias úteis"></div><div class="field"><label>Validade da proposta</label><input name="validade" type="date"></div><div class="field"><label>Forma de pagamento</label><input name="pagamento" placeholder="Ex.: 30/60 dias"></div><div class="field"><label>Garantia</label><input name="garantia" placeholder="Ex.: 12 meses"></div><div class="field full"><label>Observações</label><textarea name="observacoes" placeholder="Condições, materiais, detalhes do serviço..."></textarea></div><div class="field full"><label>Orçamento em PDF (opcional)</label><input class="file" id="pdf" type="file" accept="application/pdf"><div class="muted">Limite de 5 MB.</div></div></div><button class="submit" id="send">ENVIAR ORÇAMENTO</button></form>`;document.getElementById('form').onsubmit=e=>submit(e)}
function showError(msg){const c=document.getElementById('content');c.innerHTML='<div class="error" style="display:block">'+esc(msg)+'</div>'}
async function submit(e){e.preventDefault();const form=e.currentTarget,btn=document.getElementById('send'),err=document.getElementById('err');btn.disabled=true;err.style.display='none';const data=Object.fromEntries(new FormData(form).entries());const file=document.getElementById('pdf').files[0];if(file){if(file.type!=='application/pdf')return fail('O anexo precisa ser um PDF.');if(file.size>5*1024*1024)return fail('O PDF deve ter no máximo 5 MB.');data.anexoNome=file.name;data.anexoData=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}try{const r=await fetch(API+'/cotacoes/public/'+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível enviar o orçamento.');document.getElementById('content').innerHTML='<div class="success"><div class="check">✅</div><h2>Orçamento enviado!</h2><p>Recebemos sua proposta com sucesso.</p><p class="muted">Você já pode fechar esta página.</p></div>'}catch(e2){fail(e2.message)}}
function fail(msg){const err=document.getElementById('err');err.textContent=msg;err.style.display='block';document.getElementById('send').disabled=false}
load();
</script></body></html>
