<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enviar orçamento — Tá na Mão</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f3;color:#102016;font-family:Arial,sans-serif;padding:24px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #dce7de;border-radius:20px;padding:28px;box-shadow:0 12px 35px rgba(0,40,20,.08)}h1{margin:0 0 6px;font-size:28px}h2{font-size:17px;margin:24px 0 12px}.muted{color:#66746b}.info{background:#eff8f1;border:1px solid #cce5d2;border-radius:14px;padding:15px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;color:#66746b;margin-bottom:6px}input,textarea{width:100%;padding:12px;border:1px solid #d8e4db;border-radius:10px;font:inherit}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:11px;padding:13px 18px;background:#003b24;color:#fff;font-weight:900;cursor:pointer;width:100%}.error{display:none;background:#fff0f0;color:#a61b1b;border:1px solid #f0b8b8;border-radius:10px;padding:12px;margin-bottom:14px}.ok{display:none;text-align:center;padding:30px}.ok strong{display:block;font-size:22px;margin-bottom:8px}@media(max-width:650px){body{padding:12px}.card{padding:20px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body><div class="wrap"><div class="card" id="app">Carregando solicitação...</div></div>
<script>
const API='https://ta-na-mao-9bii.onrender.com/api';
const token=new URLSearchParams(location.search).get('token');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível carregar a solicitação.');return d}
function render(d){const app=document.getElementById('app');if(d.bloqueada){app.innerHTML='<div class="ok" style="display:block"><strong>Orçamento já enviado</strong><span class="muted">Esta solicitação de cotação já recebeu uma resposta.</span></div>';return}app.innerHTML=`<h1>Enviar orçamento</h1><div class="muted">Preencha os dados abaixo para enviar sua proposta ao condomínio.</div><div class="info"><b>Condomínio:</b> ${esc(d.condominio)}<br><b>Serviço / compra:</b> ${esc(d.servico)}${d.prazoEnvio?`<br><b>Prazo para envio:</b> ${new Date(d.prazoEnvio+'T12:00:00').toLocaleDateString('pt-BR')}`:''}</div><div class="error" id="error"></div><form id="form"><h2>Dados da empresa</h2><div class="grid"><div class="field"><label>Empresa *</label><input name="empresa" required></div><div class="field"><label>CNPJ *</label><input name="cnpj" required></div><div class="field"><label>Responsável *</label><input name="responsavel" required></div><div class="field"><label>WhatsApp *</label><input name="whatsapp" required></div><div class="field"><label>Valor do orçamento (R$) *</label><input name="valor" type="number" min="0" step="0.01" required></div><div class="field"><label>Prazo de execução</label><input name="prazoExecucao" placeholder="Ex.: 5 dias úteis"></div><div class="field"><label>Validade da proposta</label><input name="validade" placeholder="Ex.: 15 dias"></div><div class="field"><label>Forma de pagamento</label><input name="pagamento"></div><div class="field"><label>Garantia</label><input name="garantia"></div><div class="field full"><label>Observações</label><textarea name="observacoes" placeholder="Condições, materiais, detalhes da proposta etc."></textarea></div></div><button class="btn" id="send">Enviar orçamento</button></form>`;document.getElementById('form').onsubmit=submit}
async function submit(e){e.preventDefault();const btn=document.getElementById('send'),err=document.getElementById('error');btn.disabled=true;btn.textContent='Enviando...';try{await api('/cotacoes/public/'+encodeURIComponent(token),{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget).entries()))});document.getElementById('app').innerHTML='<div class="ok" style="display:block"><strong>✓ Orçamento enviado com sucesso!</strong><span class="muted">Obrigado. Sua proposta foi recebida pelo condomínio.</span></div>'}catch(ex){err.textContent=ex.message;err.style.display='block';btn.disabled=false;btn.textContent='Enviar orçamento'}}
(async()=>{try{if(!token)throw Error('Link de cotação inválido.');render(await api('/cotacoes/public/'+encodeURIComponent(token)))}catch(e){document.getElementById('app').innerHTML='<div class="error" style="display:block">'+esc(e.message)+'</div>'}})();
</script></body></html>
